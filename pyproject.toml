[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-downloader"
version = "1.0.0"
description = "A modern, minimalist YouTube downloader with a polished 2026 UI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Gabriel Castro", email = "gabrielenriquecas@gmail.com" }]
keywords = ["youtube", "downloader", "yt-dlp", "video", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "customtkinter>=5.2.2",
    "yt-dlp>=2025.1.1",
    "pillow>=11.0.0",
    "tkinterdnd2>=0.3.0",
    "pydantic>=2.6.0",
    "platformdirs>=4.2.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "types-requests>=2.32.0",
    "types-Pillow>=10.2.0",
    "pre-commit>=4.0.0",
    "pyinstaller>=6.10.0",
]

[project.scripts]
yt-downloader = "yt_downloader.__main__:main"

[project.urls]
Homepage = "https://github.com/GabrielCastroV/youtube-downloader"
Repository = "https://github.com/GabrielCastroV/youtube-downloader"
Issues = "https://github.com/GabrielCastroV/youtube-downloader/issues"
Changelog = "https://github.com/GabrielCastroV/youtube-downloader/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_downloader"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "B",              # flake8-bugbear
    "A",              # flake8-builtins
    "C4",             # flake8-comprehensions
    "PT",             # flake8-pytest-style
    "RUF",            # ruff-specific
    "SIM",            # flake8-simplify
    "TCH",            # flake8-type-checking
    "TRY",            # tryceratops
    "LOG",            # flake8-logging
]
ignore = [
    "TRY003",   # long messages in raise — acceptable for typed errors
    "TRY301",   # abstract raise to inner function
    "B008",     # function calls in default args (Pydantic validators)
    "TC001",    # moving app imports to TYPE_CHECKING — PEP 563 handles this
    "TC002",    # moving third-party imports to TYPE_CHECKING
    "TC003",    # moving stdlib imports to TYPE_CHECKING
    "N818",     # DownloadCancelled intentionally not named *Error
    "RUF001",   # ambiguous unicode in UI strings (intentional glyphs)
    "RUF002",   # ambiguous unicode in docstrings (intentional × symbol)
    "PT011",    # pytest.raises too broad — acceptable in unit tests
]

[tool.ruff.lint.isort]
known-first-party = ["yt_downloader"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
pretty = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["customtkinter.*", "tkinterdnd2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src/yt_downloader",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=60",
    "-v",
]

[tool.coverage.run]
source = ["src/yt_downloader"]
omit = ["*/ui/*", "*/assets/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
