name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug! Please fill out the sections below."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "e.g. v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste URL '...'
        2. Select format '...'
        3. Click Download
        4. See error '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error logs
      description: "Paste relevant logs from Settings → Open Logs (optional but helpful)"
      render: text
