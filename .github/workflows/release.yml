name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: yt-downloader.exe
            pyinstaller_args: "--onefile --windowed"
          - os: macos-latest
            artifact: yt-downloader.app.zip
            pyinstaller_args: "--windowed"
          - os: ubuntu-latest
            artifact: yt-downloader-linux
            pyinstaller_args: "--onefile"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Build with PyInstaller
        run: >
          uv run pyinstaller
          ${{ matrix.pyinstaller_args }}
          --name yt-downloader
          src/yt_downloader/__main__.py
      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r yt-downloader.app.zip yt-downloader.app
          rm -rf yt-downloader.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
